<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数秘術鑑定</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#e8e0d0;font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;min-height:100vh;padding-bottom:60px}
input{font-family:inherit}
button{font-family:inherit;cursor:pointer}

#header{background:linear-gradient(180deg,#1a1228 0%,#0a0a0f 100%);border-bottom:1px solid #2a2a3a;padding:36px 20px 28px;text-align:center;position:relative;overflow:hidden}
#header::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(124,92,191,0.13) 0%,transparent 70%)}
#header h1{font-size:28px;margin-bottom:8px;position:relative}
#header p{font-size:12px;color:#888899;letter-spacing:3px;position:relative}

#main{max-width:620px;margin:0 auto;padding:28px 16px 0}

.input-box{background:#12121a;border:1px solid #2a2a3a;border-radius:18px;padding:24px 20px;margin-bottom:20px}
.input-label{display:block;font-size:11px;color:#888899;letter-spacing:2px;margin-bottom:8px}
.input-field{width:100%;padding:13px 16px;background:#0d0d17;border:1.5px solid #2a2a3a;border-radius:10px;color:#e8e0d0;font-size:16px;outline:none;transition:border-color 0.3s;letter-spacing:4px}
.input-field:focus{border-color:#c9a96e}
.input-field.active{border-color:#c9a96e}
.input-field.active2{border-color:#7c5cbf}
.input-hint{font-size:11px;color:#888899;margin-top:6px}
.btn-calc{width:100%;padding:15px;background:linear-gradient(135deg,#7c5cbf 0%,#c9a96e 100%);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;letter-spacing:3px;box-shadow:0 4px 20px rgba(124,92,191,0.25)}
.btn-calc:hover{opacity:0.9}

.tabs{display:flex;gap:8px;margin-bottom:20px;background:#12121a;padding:6px;border-radius:14px;border:1px solid #2a2a3a}
.tab-btn{flex:1;padding:10px 0;background:transparent;border:none;border-radius:10px;color:#888899;font-size:13px;transition:all 0.3s}
.tab-btn.active{background:linear-gradient(135deg,#7c5cbf 0%,#c9a96e 100%);color:#fff;font-weight:700}

.card{background:linear-gradient(135deg,#12121a 0%,#1a1a28 100%);border-radius:16px;padding:20px 22px;margin-bottom:14px;position:relative;overflow:hidden}
.card-inner{display:flex;align-items:flex-start;gap:14px}
.card-num-box{min-width:56px;height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.card-icon{font-size:11px;color:#888899}
.card-number{font-size:22px;font-weight:700;font-family:Georgia,serif;line-height:1.1}
.card-raw{font-size:9px;color:#888899}
.card-body{flex:1}
.card-label{font-size:10px;color:#888899;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.card-keywords{margin-bottom:8px}
.card-kw-tag{display:inline-block;border-radius:20px;padding:2px 10px;margin-right:4px;margin-bottom:4px;font-size:10px}
.card-title{font-size:14px;font-weight:700;margin-bottom:8px}
.card-desc{font-size:12px;color:#e8e0d0;line-height:1.9;margin-bottom:8px}
.tags-wrap{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tag{border-radius:6px;padding:3px 8px;margin-bottom:4px}
.tag-label{font-size:10px;font-weight:700;margin-right:4px}
.tag-val{font-size:11px;color:#e8e0d0}

.expand-btn{margin-top:6px;padding:6px 14px;background:transparent;border-radius:20px;font-size:11px;letter-spacing:1px}
.expand-btn:hover{opacity:0.8}
.expand-content{margin-top:10px}
.expand-section{margin-bottom:10px;padding:12px;border-radius:10px}
.expand-section-title{font-size:10px;font-weight:700;margin-bottom:4px}
.expand-section-text{font-size:12px;color:#e8e0d0;line-height:1.8}

.cycle-box{background:#12121a;border:1px solid #2a2a3a;border-radius:16px;padding:20px;margin-bottom:14px}
.cycle-title{font-size:11px;color:#888899;letter-spacing:2px;margin-bottom:4px}
.cycle-hint{font-size:10px;color:#888899;margin-bottom:14px}
.cycle-year{border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.cycle-year-inner{display:flex;align-items:center;gap:12px}
.cycle-year-num-box{text-align:center;min-width:48px}
.cycle-year-label{font-size:10px;color:#888899}
.cycle-year-n{font-size:26px;font-weight:700;font-family:Georgia,serif;line-height:1.1}
.cycle-today{font-size:9px;letter-spacing:1px}
.cycle-year-info{flex:1}
.cycle-year-name{font-size:12px;font-weight:600;margin-bottom:2px}
.cycle-kw-wrap{display:flex;gap:4px;flex-wrap:wrap}
.cycle-kw{font-size:9px;color:#888899;background:#12121a;border:1px solid #2a2a3a;border-radius:10px;padding:1px 6px}
.cycle-arrow{font-size:12px;color:#888899;flex-shrink:0}
.cycle-detail{margin-top:12px;border-top:1px solid #2a2a3a;padding-top:12px}
.cycle-detail-desc{font-size:12px;color:#e8e0d0;line-height:1.9;margin-bottom:10px}
.cycle-actions{display:flex;gap:8px;flex-wrap:wrap}
.cycle-action{flex:1;min-width:130px;padding:10px;border-radius:8px}
.cycle-action-title{font-size:10px;font-weight:700;margin-bottom:4px}
.cycle-action-text{font-size:11px;color:#e8e0d0;line-height:1.7}

.empty-state{text-align:center;padding:60px 20px;color:#888899;font-size:14px;line-height:2}
.empty-icon{font-size:36px;margin-bottom:16px}

.footer-note{text-align:center;padding:16px 0;font-size:11px;color:#888899;line-height:2}

#results{display:none}
</style>
</head>
<body>

<div id="header">
  <h1>✦ 数秘術鑑定 ✦</h1>
  <p>NUMEROLOGY READING</p>
</div>

<div id="main">
  <div class="input-box">
    <div style="margin-bottom:16px">
      <label class="input-label">生年月日（8桁）</label>
      <input id="dob" class="input-field" placeholder="例：19960410" maxlength="8" oninput="this.value=this.value.replace(/\D/g,'').slice(0,8);updateInputStyle()">
    </div>
    <div style="margin-bottom:20px">
      <label class="input-label">名前（ローマ字・任意）</label>
      <input id="nameInput" class="input-field" placeholder="例：YUKI TANAKA" oninput="this.value=this.value.replace(/[^a-zA-Z\s]/g,'');updateInputStyle()">
      <div class="input-hint">※名前入力でソウル・パーソナリティ・ディスティニー・マチュリティナンバーも算出されます</div>
    </div>
    <button class="btn-calc" onclick="calculate()">✦ 鑑定する ✦</button>
  </div>

  <div id="results">
    <div class="tabs">
      <button class="tab-btn active" id="tab-core" onclick="switchTab('core')">コア数字</button>
      <button class="tab-btn" id="tab-name" onclick="switchTab('name')">名前数字</button>
      <button class="tab-btn" id="tab-cycle" onclick="switchTab('cycle')">サイクル</button>
    </div>
    <div id="panel-core"></div>
    <div id="panel-name" style="display:none"></div>
    <div id="panel-cycle" style="display:none"></div>
    <div class="footer-note">✦ ピタゴラス数秘術に基づいています ✦<br>マスターナンバー 11・22・33 は縮約しません</div>
  </div>
</div>

<script>
const LETTER_VALUES={A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,I:9,J:1,K:2,L:3,M:4,N:5,O:6,P:7,Q:8,R:9,S:1,T:2,U:3,V:4,W:5,X:6,Y:7,Z:8};
const VOWELS=new Set(["A","E","I","O","U"]);

function reduceNumber(n){while(n>9&&n!==11&&n!==22&&n!==33)n=String(n).split("").reduce((a,d)=>a+parseInt(d),0);return n;}
function sumDigits(s){return s.split("").reduce((a,d)=>a+(parseInt(d)||0),0);}
function calcLifePath(d){const s=d.replace(/\D/g,"");if(s.length!==8)return null;const t=sumDigits(s);return{raw:t,reduced:reduceNumber(t)};}
function calcBirthday(d){const s=d.replace(/\D/g,"");if(s.length!==8)return null;const day=parseInt(s.slice(6,8));return{raw:day,reduced:reduceNumber(day)};}
function calcDestiny(n){const u=n.toUpperCase().replace(/[^A-Z]/g,"");if(!u)return null;const t=u.split("").reduce((a,c)=>a+(LETTER_VALUES[c]||0),0);return{raw:t,reduced:reduceNumber(t)};}
function calcSoul(n){const u=n.toUpperCase().replace(/[^A-Z]/g,"");const v=u.split("").filter(c=>VOWELS.has(c));if(!v.length)return null;const t=v.reduce((a,c)=>a+(LETTER_VALUES[c]||0),0);return{raw:t,reduced:reduceNumber(t)};}
function calcPersonality(n){const u=n.toUpperCase().replace(/[^A-Z]/g,"");const c=u.split("").filter(c=>!VOWELS.has(c));if(!c.length)return null;const t=c.reduce((a,c)=>a+(LETTER_VALUES[c]||0),0);return{raw:t,reduced:reduceNumber(t)};}
function calcMaturity(lp,ds){if(!lp||!ds)return null;const t=lp.reduced+ds.reduced;return{raw:t,reduced:reduceNumber(t)};}
function calcPersonalYear(d,yr){const s=d.replace(/\D/g,"");if(s.length!==8)return null;const mmdd=s.slice(4,8);const t=sumDigits(mmdd)+sumDigits(String(yr));return{raw:t,reduced:reduceNumber(t)};}
function calcAttitude(d){const s=d.replace(/\D/g,"");if(s.length!==8)return null;const mmdd=s.slice(4,8);const t=sumDigits(mmdd);return{raw:t,reduced:reduceNumber(t)};}

function updateInputStyle(){
  const dob=document.getElementById('dob');
  const nm=document.getElementById('nameInput');
  dob.className='input-field'+(dob.value.length===8?' active':'');
  nm.className='input-field'+(nm.value.trim()?' active2':'');
}

const LIFE_PATH={
  1:{title:"リーダー・開拓者",keyword:"独立 / 創始 / 意志",desc:"1はすべての数の始まりであり、独立・創造・リーダーシップを象徴します。あなたは自らの道を切り開く使命を持ち、群れに従うよりも先頭に立つことで本領を発揮します。強い意志と行動力、独自のアイデアで新しい分野を開拓する力があります。人生で繰り返し「自分で決断する」「自立する」というテーマが訪れるでしょう。依存や他者への追随は魂の成長を妨げます。",strength:"強い意志・行動力・独創性・決断力・パイオニア精神",shadow:"頑固・自己中心的・孤立しやすい・他者の意見を聞けない",love:"恋愛では主導権を持ちたがる傾向。相手を引っ張るリードが魅力になる一方、対等なパートナーシップを意識することが大切。束縛を嫌い、自由と自立を尊重し合える関係が理想。",money:"独立・起業・新規開拓で財を築く。人の下で働くよりも自分でビジネスを持つほうが向いている。スタートダッシュの強さは抜群だが、持続力と管理が課題。",career:"起業家・経営者・プロデューサー・スポーツ選手・政治家・発明家",growth:"他者の意見にも耳を傾け、チームワークを学ぶことで真のリーダーへと成長する。"},
  2:{title:"協調者・仲介者",keyword:"調和 / 感受性 / 協力",desc:"2は陰陽のバランス、二極の調和を象徴する数。あなたは生まれながらの外交官であり、対立する二つの間に立ち橋渡しをする天才です。繊細な感受性と高い共感力で、相手の気持ちをすぐに読み取ることができます。表舞台よりも裏方として力を発揮することも多く、縁の下の力持ちとして組織を支えます。",strength:"共感力・協調性・外交力・直感力・忍耐力・細やかな気配り",shadow:"優柔不断・過度な依存・自己主張が弱い・傷つきやすい",love:"深い愛情とパートナーシップを求める。相手を支えることに喜びを感じるが、尽くしすぎて消耗することも。自分の気持ちも大切にするバランスが鍵。",money:"コツコツ型で安定志向。リスクより安定を好む。パートナーとの共同事業が向いている。",career:"カウンセラー・外交官・調停者・音楽家・看護師・秘書・心理士",growth:"「NO」と言う練習をし、自分の境界線を持つことで、真の調和と自立を両立させる。"},
  3:{title:"表現者・創造者",keyword:"表現 / 喜び / 創造",desc:"3は三位一体を象徴し、創造と喜びのエネルギーを持つ数です。あなたは言葉・芸術・ユーモアを通じて人々の心に光をともす役割があります。コミュニケーション能力が高く、どんな場でも空気を明るくする力があります。アイデアが次々と湧き出る創造的な頭脳を持ち、自己表現することで魂が輝きます。",strength:"表現力・創造性・ユーモア・社交性・楽観主義・コミュニケーション能力",shadow:"散漫・飽きっぽい・感情の起伏が激しい・表面的になりやすい",love:"明るく楽しい恋愛を求める。笑いのある関係が大切で、愛情表現が豊かで相手を喜ばせる天才。",money:"才能を売る仕事でお金を得る。副業や創作活動からの収入も多い。計画的な貯蓄が課題。",career:"作家・芸術家・俳優・コメディアン・デザイナー・教師・スピーカー・ミュージシャン",growth:"一つのことを深めることで、表面的な表現から魂レベルの創造へと昇華する。"},
  4:{title:"建設者・実務家",keyword:"安定 / 勤勉 / 基盤",desc:"4は四方位・四季・四元素を象徴し、安定と秩序を司る数です。あなたは社会や家族の「基盤」を築く使命を持ち、地道な努力と誠実さで信頼を積み上げます。計画性と組織力に優れ、言ったことを必ず実行する責任感の強さが際立ちます。",strength:"勤勉・誠実・組織力・計画性・責任感・信頼性・忍耐力",shadow:"頑固・融通が利かない・変化への抵抗・ワーカホリック",love:"安定した長期的な関係を求める。派手さよりも誠実さと信頼を重視。ゆっくりと関係を築くタイプ。",money:"コツコツ型で堅実な財形が得意。不動産・長期投資など安定志向が向いている。",career:"エンジニア・建築家・会計士・医師・管理職・農業・製造業・システム開発",growth:"「完璧でなくてもいい」という柔軟さを身につけることで、堅固な人生に豊かさが加わる。"},
  5:{title:"自由人・冒険者",keyword:"自由 / 変化 / 多様性",desc:"5は五感と人間の自由意志を象徴する数。あなたは変化・冒険・多様な経験を通じて成長する魂です。好奇心旺盛で飽きることを知らず、常に新しいことへと向かうエネルギーを持ちます。真の自由とは「規律の中にある自由」であることを学ぶことが成長の鍵です。",strength:"適応力・コミュニケーション力・行動力・多才・好奇心・柔軟性",shadow:"無責任・刺激中毒・落ち着きのなさ・物事を中途半端にしやすい",love:"束縛を嫌い、自由を大切にするパートナーシップを求める。相手にも自由を与えられる関係が長続きの秘訣。",money:"波のある収入パターン。多方面に収入源を持つのが向いている。ギャンブルや投機には要注意。",career:"旅行業・ジャーナリスト・マーケター・営業・フリーランス・通訳・起業家",growth:"「やり遂げる力」を養うことで、無限の可能性が具体的な果実へと変わる。"},
  6:{title:"奉仕者・癒し手",keyword:"愛情 / 責任 / 奉仕",desc:"6は完全性と美を象徴する数。愛・調和・奉仕のエネルギーを持ち、家族やコミュニティを守る「癒し手」として輝きます。責任感が強く、周囲の人が困っていると放っておけない性質を持ちます。「与えすぎる」傾向があり、自己犠牲に陥りやすいことが最大の課題。",strength:"愛情深さ・責任感・美的センス・癒しの力・誠実さ・包容力",shadow:"過干渉・自己犠牲・完璧主義・世話を焼きすぎる",love:"愛情深いパートナー。家族を大切にし、安定した家庭を築くことに喜びを感じる。",money:"奉仕職や福祉・美容・教育など「人の役に立つ仕事」でお金の流れが良くなる。",career:"医師・看護師・教師・保育士・カウンセラー・デザイナー・料理人",growth:"「自分を愛することが、他者を愛する土台」という真理を体現することで魂が輝く。"},
  7:{title:"探求者・哲人",keyword:"真実 / 知恵 / 内省",desc:"7はすべての数の中で最もスピリチュアルで神秘的な数です。真実・知識・精神的洞察を追い求める「孤高の探求者」として生きる魂です。深い分析力と直感力を兼ね備え、物事の表面ではなく本質を見抜く力があります。",strength:"分析力・直感力・知性・精神性・洞察力・集中力・独創的思考",shadow:"孤立・冷淡に見られる・懐疑心・感情表現が苦手",love:"深く信頼できる相手とでなければ心を開けない。魂レベルで繋がれるパートナーを求める。",money:"お金よりも「知識・真実・時間」に価値を置く。専門性を活かした仕事で安定した収入を得る。",career:"研究者・哲学者・占い師・心理士・作家・科学者・ITエンジニア",growth:"「完全に理解できなくても信頼する」感覚を育てることで、孤高から繋がりへと開いていく。"},

function getMeaning(type,num){
  const maps={lifePath:LIFE_PATH,birthday:BIRTHDAY_DETAIL,soul:SOUL_DETAIL,personality:PERSONALITY_DETAIL,destiny:DESTINY_DETAIL,personalYear:PERSONAL_YEAR_DETAIL,attitude:ATTITUDE_DETAIL,maturity:MATURITY_DETAIL};
  return maps[type]?.[num]||maps[type]?.[reduceNumber(num)]||null;
}

// ── カラー定義 ──
const CARD_COLORS={
  gold:"#d4af37", accent:"#c9a96e", blue:"#70b8e0",
  purple:"#9b59b6", red:"#e07070", green:"#70e0b0",
  yellow:"#e0b870", lime:"#b0d070"
};

// ── カード生成 ──
let expandCounter=0;
function makeCard(label,number,raw,detail,color,icon){
  if(!number&&number!==0) return "";
  const id="exp"+(expandCounter++);
  const d=detail;
  let inner="";
  if(!d){
    inner=`<div style="font-size:13px;color:#888899">データなし</div>`;
  } else if(typeof d==="string"){
    inner=`<div style="font-size:13px;color:#e8e0d0;line-height:1.8">${d}</div>`;
  } else {
    let kwHtml="";
    if(d.keyword){
      kwHtml=d.keyword.split(" / ").map(k=>`<span class="card-kw-tag" style="background:${color}18;border:1px solid ${color}40;color:${color}">${k}</span>`).join("");
    }
    let tagsHtml="";
    if(d.strength) tagsHtml+=makeTag("強み",d.strength,CARD_COLORS.accent);
    if(d.talent) tagsHtml+=makeTag("才能",d.talent,CARD_COLORS.accent);
    if(d.shadow) tagsHtml+=makeTag("課題",d.shadow,"#e07070");
    if(d.career) tagsHtml+=makeTag("適職",d.career,"#9b59b6");
    if(d.good) tagsHtml+=makeTag("向いている行動",d.good,"#70e0a0");
    if(d.bad) tagsHtml+=makeTag("避けたほうがいい行動",d.bad,"#e07070");

    let expandHtml="";
    if(d.love||d.money||d.growth){
      let sections="";
      if(d.love) sections+=`<div class="expand-section" style="background:#e0707018;border-left:3px solid #e07070"><div class="expand-section-title" style="color:#e07070">❤ 愛とパートナーシップ</div><div class="expand-section-text">${d.love}</div></div>`;
      if(d.money) sections+=`<div class="expand-section" style="background:#d4af3718;border-left:3px solid #d4af37"><div class="expand-section-title" style="color:#d4af37">💰 お金と財</div><div class="expand-section-text">${d.money}</div></div>`;
      if(d.growth) sections+=`<div class="expand-section" style="background:#70e0a018;border-left:3px solid #70e0a0"><div class="expand-section-title" style="color:#70e0a0">🌱 成長のテーマ</div><div class="expand-section-text">${d.growth}</div></div>`;
      expandHtml=`
        <button class="expand-btn" id="btn-${id}" style="border:1px solid ${color}50;color:${color}" onclick="toggleExpand('${id}')">▼ 愛・お金・成長テーマ</button>
        <div class="expand-content" id="${id}" style="display:none">${sections}</div>`;
    }
    inner=`
      <div class="card-keywords">${kwHtml}</div>
      ${d.title?`<div class="card-title" style="color:${color}">${d.title}</div>`:""}
      ${d.desc?`<div class="card-desc">${d.desc}</div>`:""}
      <div class="tags-wrap">${tagsHtml}</div>
      ${expandHtml}`;
  }
  const rawDisp=(raw&&raw!==number)?`<div class="card-raw">(${raw})</div>`:"";
  return `
  <div class="card" style="border:1px solid ${color}40">
    <div style="position:absolute;top:-20px;right:-20px;font-size:80px;opacity:0.04;color:${color};font-family:Georgia,serif;line-height:1;pointer-events:none">${number}</div>
    <div class="card-inner">
      <div class="card-num-box" style="background:${color}18;border:1.5px solid ${color}50">
        <div class="card-icon">${icon}</div>
        <div class="card-number" style="color:${color}">${number}</div>
        ${rawDisp}
      </div>
      <div class="card-body">
        <div class="card-label">${label}</div>
        ${inner}
      </div>
    </div>
  </div>`;
}

function makeTag(label,value,color){
  return `<div class="tag" style="background:${color}15;border:1px solid ${color}40"><span class="tag-label" style="color:${color}">${label}:</span><span class="tag-val">${value}</span></div>`;
}

function toggleExpand(id){
  const el=document.getElementById(id);
  const btn=document.getElementById("btn-"+id);
  if(el.style.display==="none"){
    el.style.display="block";
    btn.textContent="▲ 閉じる";
  } else {
    el.style.display="none";
    btn.textContent="▼ 愛・お金・成長テーマ";
  }
}

// ── サイクルカード ──
let cycleCounter=0;
function makeCycleCard(yr,n,isCurrent,dob){
  const id="cy"+(cycleCounter++);
  const d=getMeaning("personalYear",n);
  const bg=isCurrent?"rgba(201,169,110,0.07)":"#0d0d17";
  const border=isCurrent?"#c9a96e":"#2a2a3a";
  const numColor=isCurrent?"#c9a96e":"#e8e0d0";
  let kwHtml="";
  if(d&&d.keyword) kwHtml=d.keyword.split(" / ").map(k=>`<span class="cycle-kw">${k}</span>`).join("");
  let detailHtml="";
  if(d){
    let actHtml="";
    if(d.good) actHtml+=`<div class="cycle-action" style="background:#70e0a018;border-left:3px solid #70e0a0"><div class="cycle-action-title" style="color:#70e0a0">✅ 向いている行動</div><div class="cycle-action-text">${d.good}</div></div>`;
    if(d.bad) actHtml+=`<div class="cycle-action" style="background:#e0707018;border-left:3px solid #e07070"><div class="cycle-action-title" style="color:#e07070">⚠ 避けたほうがいい</div><div class="cycle-action-text">${d.bad}</div></div>`;
    detailHtml=`<div class="cycle-detail" id="${id}" style="display:none">
      <div class="cycle-detail-desc">${d.desc}</div>
      <div class="cycle-actions">${actHtml}</div>
    </div>`;
  }
  const todayBadge=isCurrent?`<div class="cycle-today" style="color:#c9a96e">今年</div>`:"";
  return `
  <div class="cycle-year" style="background:${bg};border:1px solid ${border}" onclick="${d?`toggleCycle('${id}')`:``}">
    <div class="cycle-year-inner">
      <div class="cycle-year-num-box">
        <div class="cycle-year-label">${yr}</div>
        <div class="cycle-year-n" style="color:${numColor}">${n}</div>
        ${todayBadge}
      </div>
      <div class="cycle-year-info">
        ${d?`<div class="cycle-year-name" style="color:${isCurrent?"#c9a96e":"#e8e0d0"}">${d.title}</div><div class="cycle-kw-wrap">${kwHtml}</div>`:`<div style="font-size:11px;color:#888899">—</div>`}
      </div>
      ${d?`<div class="cycle-arrow" id="arr-${id}">▼</div>`:""}
    </div>
    ${detailHtml}
  </div>`;
}

function toggleCycle(id){
  const el=document.getElementById(id);
  const arr=document.getElementById("arr-"+id);
  if(el.style.display==="none"){el.style.display="block";if(arr)arr.textContent="▲";}
  else{el.style.display="none";if(arr)arr.textContent="▼";}
}

// ── メイン計算 ──
let currentDob="";
function calculate(){
  const dob=document.getElementById('dob').value.replace(/\D/g,"");
  const name=document.getElementById('nameInput').value.trim();
  if(dob.length!==8){alert("生年月日を8桁で入力してください（例：19960410）");return;}
  currentDob=dob;
  expandCounter=0; cycleCounter=0;
  const currentYear=new Date().getFullYear();
  const lp=calcLifePath(dob);
  const bd=calcBirthday(dob);
  const ds=name?calcDestiny(name):null;
  const sl=name?calcSoul(name):null;
  const pe=name?calcPersonality(name):null;
  const mt=(lp&&ds)?calcMaturity(lp,ds):null;
  const py=calcPersonalYear(dob,currentYear);
  const at=calcAttitude(dob);

  // Core panel
  let coreHtml=makeCard("ライフパスナンバー（運命数）",lp.reduced,lp.raw,getMeaning("lifePath",lp.reduced),CARD_COLORS.gold,"★");
  coreHtml+=makeCard("バースデーナンバー（才能数）",bd.reduced,bd.raw,getMeaning("birthday",bd.raw)||getMeaning("birthday",bd.reduced),CARD_COLORS.accent,"◈");
  if(mt) coreHtml+=makeCard("マチュリティナンバー（成熟数・晩年のテーマ）",mt.reduced,mt.raw,getMeaning("maturity",mt.reduced),CARD_COLORS.blue,"◎");
  document.getElementById('panel-core').innerHTML=coreHtml;

  // Name panel
  let nameHtml="";
  if(ds){
    nameHtml+=makeCard("ディスティニーナンバー（使命数）",ds.reduced,ds.raw,getMeaning("destiny",ds.reduced),CARD_COLORS.purple,"◇");
    if(sl) nameHtml+=makeCard("ソウルナンバー（魂の欲求）",sl.reduced,sl.raw,getMeaning("soul",sl.reduced),CARD_COLORS.red,"♡");
    if(pe) nameHtml+=makeCard("パーソナリティナンバー（外側の印象）",pe.reduced,pe.raw,getMeaning("personality",pe.reduced),CARD_COLORS.green,"◉");
  } else {
    nameHtml=`<div class="empty-state"><div class="empty-icon">✦</div>名前（ローマ字）を入力すると<br>ディスティニー・ソウル・<br>パーソナリティナンバーが<br>算出されます</div>`;
  }
  document.getElementById('panel-name').innerHTML=nameHtml;

  // Cycle panel
  let cycleHtml=makeCard(`パーソナルイヤーナンバー（${currentYear}年のテーマ）`,py.reduced,py.raw,getMeaning("personalYear",py.reduced),CARD_COLORS.yellow,"◑");
  cycleHtml+=makeCard("アティテュードナンバー（初対面の印象）",at.reduced,at.raw,getMeaning("attitude",at.reduced),CARD_COLORS.lime,"◐");
  cycleHtml+=`<div class="cycle-box"><div class="cycle-title">9年サイクル（前後の流れ）</div><div class="cycle-hint">各年をタップするとテーマ・向いている行動を表示します</div>`;
  [-2,-1,0,1,2,3,4,5,6].forEach(offset=>{
    const yr=currentYear+offset;
    const mmdd=dob.slice(4,8);
    const total=sumDigits(mmdd)+sumDigits(String(yr));
    const n=reduceNumber(total);
    cycleHtml+=makeCycleCard(yr,n,offset===0,dob);
  });
  cycleHtml+="</div>";
  document.getElementById('panel-cycle').innerHTML=cycleHtml;

  document.getElementById('results').style.display='block';
  switchTab('core');
  document.getElementById('results').scrollIntoView({behavior:'smooth'});
}

function switchTab(tab){
  ['core','name','cycle'].forEach(t=>{
    document.getElementById('tab-'+t).className='tab-btn'+(t===tab?' active':'');
    document.getElementById('panel-'+t).style.display=(t===tab?'block':'none');
  });
}
